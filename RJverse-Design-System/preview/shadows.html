<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Shadows & elevation" subtitle="xs → glow (tinted with midnight)" viewport="700x190" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-body); }
  body { padding: 36px 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .demo {
    width: 100%; height: 80px;
    background: #fff;
    border-radius: var(--radius-lg);
  }
  .name { font-family: var(--font-heading); font-size: 12px; color: var(--rj-ink); font-weight: 600;}
  .desc { font-family: var(--font-mono, ui-monospace); font-size: 10px; color: var(--rj-ink-3); text-align: center;}
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="demo" style="box-shadow: var(--shadow-xs);"></div><span class="name">--shadow-xs</span><span class="desc">subtle lift</span></div>
  <div class="item"><div class="demo" style="box-shadow: var(--shadow-sm);"></div><span class="name">--shadow-sm</span><span class="desc">resting card</span></div>
  <div class="item"><div class="demo" style="box-shadow: var(--shadow-md);"></div><span class="name">--shadow-md</span><span class="desc">hover / default card</span></div>
  <div class="item"><div class="demo" style="box-shadow: var(--shadow-lg);"></div><span class="name">--shadow-lg</span><span class="desc">menu / popover</span></div>
  <div class="item"><div class="demo" style="box-shadow: var(--shadow-glow); background: var(--rj-blue-500);"></div><span class="name">--shadow-glow</span><span class="desc">primary CTA</span></div>
</div>
</body>
</html>
