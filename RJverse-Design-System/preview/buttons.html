<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · secondary · ghost · dark · disabled" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-body); }
  body { padding: 28px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px;}

  .btn {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: var(--radius-pill);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all var(--dur-base) var(--ease-out);
    line-height: 1;
  }
  .btn-primary {
    background: var(--rj-blue-500);
    color: #fff;
    box-shadow: var(--shadow-glow);
  }
  .btn-primary:hover {
    background: var(--rj-blue-600);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: #fff;
    color: var(--rj-blue-500);
    border-color: var(--border-2);
  }
  .btn-secondary:hover { border-color: var(--rj-blue-500); }
  .btn-ghost {
    background: transparent;
    color: var(--rj-blue-500);
  }
  .btn-ghost:hover { background: var(--rj-blue-50); }
  .btn-dark {
    background: var(--rj-midnight);
    color: #fff;
  }
  .btn-disabled {
    background: var(--rj-blue-100);
    color: var(--rj-ink-3);
    cursor: not-allowed;
  }
  .arrow { font-size: 16px; }
</style>
</head>
<body>
  <button class="btn btn-primary">Start a project <span class="arrow">→</span></button>
  <button class="btn btn-secondary">Book a workshop</button>
  <button class="btn btn-ghost">Learn more <span class="arrow">→</span></button>
  <button class="btn btn-dark">Download brief</button>
  <button class="btn btn-disabled">Coming soon</button>
</body>
</html>
