<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · –space-1 → –space-24" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-body); }
  body { padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 100%; background: var(--rj-blue-500); border-radius: 4px; }
  .label { font-family: var(--font-mono, ui-monospace); font-size: 10px; color: var(--rj-ink-2); }
  .px { font-family: var(--font-heading); font-size: 11px; color: var(--rj-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="bar" style="height: 4px;"></div><span class="px">4</span><span class="label">--space-1</span></div>
  <div class="item"><div class="bar" style="height: 8px;"></div><span class="px">8</span><span class="label">--space-2</span></div>
  <div class="item"><div class="bar" style="height: 12px;"></div><span class="px">12</span><span class="label">--space-3</span></div>
  <div class="item"><div class="bar" style="height: 16px;"></div><span class="px">16</span><span class="label">--space-4</span></div>
  <div class="item"><div class="bar" style="height: 20px;"></div><span class="px">20</span><span class="label">--space-5</span></div>
  <div class="item"><div class="bar" style="height: 24px;"></div><span class="px">24</span><span class="label">--space-6</span></div>
  <div class="item"><div class="bar" style="height: 32px;"></div><span class="px">32</span><span class="label">--space-8</span></div>
  <div class="item"><div class="bar" style="height: 40px;"></div><span class="px">40</span><span class="label">--space-10</span></div>
  <div class="item"><div class="bar" style="height: 48px;"></div><span class="px">48</span><span class="label">--space-12</span></div>
  <div class="item"><div class="bar" style="height: 64px;"></div><span class="px">64</span><span class="label">--space-16</span></div>
  <div class="item"><div class="bar" style="height: 96px;"></div><span class="px">96</span><span class="label">--space-24</span></div>
</div>
</body>
</html>
