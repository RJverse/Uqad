<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs · sm · md · lg · xl · pill" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-body); }
  body { padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .demo {
    width: 100%;
    height: 76px;
    background: linear-gradient(135deg, var(--rj-sky-blue), var(--rj-blue-500));
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: var(--font-mono, ui-monospace);
    font-size: 11px;
  }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .name { font-family: var(--font-heading); font-size: 12px; color: var(--rj-ink); font-weight: 600; }
  .px { font-family: var(--font-mono, ui-monospace); font-size: 10px; color: var(--rj-ink-3); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="demo" style="border-radius: 4px;">4</div><span class="name">--radius-xs</span><span class="px">4px · inputs</span></div>
  <div class="item"><div class="demo" style="border-radius: 8px;">8</div><span class="name">--radius-sm</span><span class="px">8px · chips, tags</span></div>
  <div class="item"><div class="demo" style="border-radius: 12px;">12</div><span class="name">--radius-md</span><span class="px">12px · buttons</span></div>
  <div class="item"><div class="demo" style="border-radius: 18px;">18</div><span class="name">--radius-lg</span><span class="px">18px · cards</span></div>
  <div class="item"><div class="demo" style="border-radius: 24px;">24</div><span class="name">--radius-xl</span><span class="px">24px · hero</span></div>
  <div class="item"><div class="demo" style="border-radius: 999px;">∞</div><span class="name">--radius-pill</span><span class="px">pill · CTA</span></div>
</div>
</body>
</html>
