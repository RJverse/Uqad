<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Site" name="Site UI kit" subtitle="Bilingual consultant site — hero, services, workshops, about, contact" viewport="1280x900" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RJverse — Digital solutions, crafted for your own universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Workshops.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => {
  const [lang, setLang] = React.useState('en');
  const [page, setPage] = React.useState('home');

  React.useEffect(() => {
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
  }, [lang]);

  const onNav = (k) => {
    setPage(k);
    // Smooth scroll to section if present
    const target = document.getElementById('sec-' + k);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const onCta = (k) => {
    if (k === 'workshops') onNav('workshops');
    if (k === 'start') onNav('contact');
  };

  const isAr = lang === 'ar';
  return (
    <>
      <SiteHeader current={page} onNav={onNav} lang={lang} onLangToggle={() => setLang(l => l === 'en' ? 'ar' : 'en')}/>
      <main>
        <div id="sec-home"><Hero lang={lang} onCta={onCta}/></div>
        <div id="sec-services"><Services lang={lang}/></div>
        <div id="sec-workshops"><Workshops lang={lang}/></div>
        <div id="sec-about"><About lang={lang}/></div>
        <div id="sec-contact"><Contact lang={lang}/></div>
        <Footer lang={lang}/>
      </main>
      <button className="rj-fab" title={isAr ? 'تواصل عبر واتساب' : 'WhatsApp us'} aria-label="WhatsApp">
        <Icon name="whatsapp" size={24}/>
      </button>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
